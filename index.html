<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Trinity has moved</title>
    <link rel="canonical" href="https://trinity-rsi.github.io/" />
    <meta name="robots" content="noindex" />
    <script>
      // keep the path, query and hash: /Trinity/#results -> https://trinity-rsi.github.io/#results
      location.replace('https://trinity-rsi.github.io/' + location.pathname.replace(/^\/Trinity\/?/, '') + location.search + location.hash);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=https://trinity-rsi.github.io/" /></noscript>
    <style>
      :root { color-scheme: light dark; --paper: #f3f4f7; --ink: #12141c; --ink3: #6b7080; --accent: #c8102e; }
      @media (prefers-color-scheme: dark) { :root { --paper: #080b14; --ink: #eceef5; --ink3: #8d93a5; --accent: #e5405c; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 500 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      p { margin: 0; text-align: center; }
      .k { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); }
      a { display: inline-block; margin-top: 10px; color: var(--accent); font-weight: 750; font-size: 20px; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <p class="k">The Trinity has moved</p>
      <p><a href="https://trinity-rsi.github.io/">trinity-rsi.github.io →</a></p>
    </main>
  </body>
</html>
